<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>口碑明细 · 正式库 数据服务</title>
<style>
:root{--ink:#23344e;--muted:#7b8aa1;--blue:#376aff;--line:#e2eaf7}*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:var(--ink);font:14px/1.6 "Microsoft YaHei",sans-serif}header{display:flex;justify-content:space-between;align-items:center;background:white;border-bottom:1px solid var(--line);padding:18px 28px}main{max-width:1200px;margin:30px auto;padding:0 20px}h1{font-size:26px;margin:0}a{color:var(--blue)}.muted{color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px}.stats strong{font-size:24px;display:block}.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{display:flex;flex-direction:column;gap:6px}input,select,button{font:inherit;padding:10px 13px;border:1px solid var(--line);border-radius:7px;background:white}button{cursor:pointer}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.review{padding:18px 0;border-bottom:1px solid var(--line)}.review:last-child{border:0}.review-head{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.badge{font-size:12px;background:#edf3ff;padding:3px 8px;border-radius:5px}.text{white-space:pre-wrap;overflow-wrap:anywhere;padding-top:12px}.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}.error{color:#b74724}.note{font-size:12px;color:var(--muted)}@media(max-width:600px){header{padding:14px}main{margin:18px auto;padding:0 12px}.card{padding:16px}.filters label{width:100%}.stats{gap:16px}.stats strong{font-size:21px}}

body{background:#edf4fe;color:#233044;font-family:'Segoe UI','Microsoft YaHei',sans-serif}
header{padding:15px 28px;font-size:13px}header a{text-decoration:none;color:#61748d}
main{max-width:1480px;margin:0 auto;padding:32px 24px 40px}
.page-hero{padding:3px 0 22px}.eyebrow{color:#376aff;font-weight:700;font-size:12px;letter-spacing:2px;margin:0 0 12px}h1{font-size:32px;line-height:1.4;letter-spacing:-.02em}h1 span{color:#5188ff}.page-hero .muted{font-size:13px;margin:10px 0 0;line-height:1.8}
.card{border:0;border-radius:17px;padding:22px;margin-bottom:20px;box-shadow:0 8px 26px #3460a008}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:0}
.stat{border:1px solid #e3ebf9;border-radius:14px;padding:22px 12px;text-align:center;background:#fff}
.stats strong{font-size:32px;line-height:1.2;color:#376aff;font-weight:700;letter-spacing:-.025em}
.stat-label{display:block;color:#586b84;font-size:12px;margin-top:14px}.stat-label:before{content:'';display:block;width:22px;height:2px;background:#6590ff;margin:0 auto 10px}
.note{margin:15px 0 0;font-size:11px;line-height:1.8}
.filters{gap:15px;align-items:end}.filters label{font-size:12px;color:#73839b;flex:1;min-width:180px}.filters label:nth-child(2){flex:0 1 180px}
input,select,button{min-height:42px;border-radius:9px;padding:10px 13px;font-size:13px;color:#26384f;border-color:#e1eafb}
input::placeholder{color:#91a1b8}button{min-width:76px}button.primary{background:#5087ff;box-shadow:0 4px 10px #5087ff28;border-color:#5087ff;font-weight:600}button.primary:hover{background:#356ee8}button:not(.primary):hover{background:#f1f6fd}
.results-card{padding:0;overflow:hidden}.results-head{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #e3eaf6}.results-head h2{margin:0;font-size:17px;display:flex;align-items:center;gap:9px}.results-head h2:before{content:'';height:18px;width:4px;border-radius:3px;background:#5087ff}.results-head span{font-size:11px;color:#8294ad}
.table-wrap{overflow-x:auto}.review-table{border-collapse:collapse;width:100%;min-width:780px;text-align:left}.review-table th{font-size:12px;font-weight:600;color:#59708f;background:#f4f7fd;padding:14px 18px;white-space:nowrap}.review-table td{padding:15px 18px;font-size:13px;vertical-align:middle;border-top:1px solid #e8eef8}.review-table th:first-child,.review-table td:first-child{width:55px;text-align:center}.review-table td.model-name{font-weight:600}.review-table tr:hover td{background:#fbfdff}.review-table a{text-decoration:none;font-size:12px}.badge{background:#edf3ff;color:#4b78c2;font-size:11px;border-radius:6px;white-space:nowrap}
.review-table .review-body td{padding:0 18px 14px;text-align:left;border:0}.review-body summary{font-size:12px;color:#577bb0;cursor:pointer;padding:4px 0}.text{font-size:13px;line-height:1.9;background:#f6f9fe;padding:15px;margin:8px 0 0;border-radius:9px;max-width:100%;white-space:pre-wrap}.pager{padding:17px 22px;margin:0;border-top:1px solid #e8eef8}.pager button{font-size:12px;min-height:35px}.empty-state{padding:30px;color:#6a7d97;text-align:center}.error{padding:20px}
.insight-btn{font-size:12px;min-height:30px;padding:6px 12px;border-radius:8px;background:#eef3ff;color:#376aff;border:1px solid #cfdcff;font-weight:600;cursor:pointer;transition:background .15s ease}
.insight-btn:hover:not(:disabled){background:#dde7ff;color:#1f4cd9}
.insight-btn:disabled{background:#f3f5f9;color:#9aa6b8;border-color:#e1e6ef;cursor:not-allowed}
.model-link{color:var(--blue);text-decoration:none;font-weight:600}
.model-link:hover{text-decoration:underline}
.model-link.disabled{color:#9aa6b8;cursor:default}
@media(max-width:1000px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.filters{flex-wrap:wrap}}
@media(max-width:600px){header{padding:13px 16px}main{padding:22px 14px}h1{font-size:25px}.card{padding:16px;border-radius:13px}.results-card{padding:0}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:18px 8px}.stats strong{font-size:27px}.filters label,.filters label:nth-child(2){flex:1 1 100%;min-width:0}.results-head{padding:16px}.results-head span{display:none}.pager{padding:14px;gap:7px}.pager span{font-size:11px}}
</style></head><body><header><strong>口碑明细 · 正式库 数据服务</strong><a href="/">返回主页</a></header><main>
<section class="page-hero"><p class="eyebrow">AUTOMOTIVE REPUTATION INTELLIGENCE</p><h1>口碑明细 <span>· 原始用户反馈</span></h1><p class="muted">汽车之家 · 懂车帝原始口碑，按车型、平台与正文关键词查询；平台评分按原值展示，标签分析单独核验。</p></section><section class="card"><div class="stats" id="overview">正在读取真实来源…</div><p class="note" id="analysis"></p></section>
<section class="card filters"><label>车型（精确来源名称）<input id="model" placeholder="如：理想i8 / 星光730新能源"></label><label>平台<select id="source"><option value="">全部平台</option><option value="autohome">汽车之家</option><option value="dongchedi">懂车帝</option></select></label><label>正文关键词<input id="keyword" placeholder="如：空间 / 续航"></label><button id="query" class="primary">查询</button><button id="reset">重置</button></section>
<section class="card results-card"><div class="results-head"><h2>原始口碑列表</h2><span>按发布日期倒序 · 点击展开完整原文</span></div><div id="results" class="table-wrap" aria-live="polite">正在读取原文…</div><div class="pager"><button id="prev" disabled>上一页</button><span id="count" class="muted"></span><button id="next" disabled>下一页</button></div></section>
</main><script>
const $=id=>document.getElementById(id);const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n).toLocaleString('en-US');
let offset=0,version='',serial=0;let filters={};
const NEW_CAR_MODELS=new Set();let newCarModelsLoaded=false;
async function loadNewCarModelSet(){try{const r=await fetch('/api/new-car/list?limit=2000',{cache:'no-store',headers:{'Accept':'application/json'}});if(!r.ok)return;const d=await r.json();const rows=(d&&Array.isArray(d.rows))?d.rows:[];for(const row of rows){if(row&&row.model)NEW_CAR_MODELS.add(String(row.model));}newCarModelsLoaded=true;}catch(_){newCarModelsLoaded=true;}}
$('model').value=new URLSearchParams(location.search).get('model')||'';
async function overview(){try{const r=await fetch('/api/reputation/overview',{cache:'no-store'});const d=await r.json();if(!r.ok||!d.success)throw Error();const s=d.status;const stat=(n,label)=>'<div class="stat"><strong>'+fmt(n)+'</strong><span class="stat-label">'+esc(label)+'</span></div>';$('overview').innerHTML=stat(s.review_count,'原始口碑数')+s.sources.map(x=>stat(x.review_count,x.source==='autohome'?'汽车之家':'懂车帝')).join('')+stat(s.source_model_count,'来源车型名称')+stat(s.matched_new_car_model_count,'对应新车车型');$('analysis').textContent='最新发布日期 '+s.latest_published_date+' · '+(s.analysis_current?'本批已扫描 '+s.analysis_processed_review_count+' 条，'+s.analysis_model_count+' 个来源名称有明确标签':'原文已更新，标签需维护端增量更新')+' · 批次 '+s.analysis_batch;}catch(e){$('overview').textContent='口碑来源查询失败，不使用本地看板或静态数据回退';}}
function openInsight(model){if(!model)return;window.location.href='/reputation-insight?model='+encodeURIComponent(model);}
function renderInsightCell(model){if(!model){return '<span class="muted">车型未提供</span>';}
if(newCarModelsLoaded&&NEW_CAR_MODELS.size&&!NEW_CAR_MODELS.has(model)){return '<button type="button" class="insight-btn" disabled title="该来源车型名称未匹配到新车库">' + esc(model) + ' · 未匹配</button>';}
return '<button type="button" class="insight-btn" data-insight-model="' + esc(model) + '" title="查看该车型的口碑洞察与三级标签下钻">口碑洞察</button>';}
function renderModelCell(model){const safe=esc(model||'来源车型名称未提供');if(!model){return safe;}
if(newCarModelsLoaded&&NEW_CAR_MODELS.size&&!NEW_CAR_MODELS.has(model)){return '<span class="model-link disabled" title="该来源车型名称未匹配到新车库">'+safe+'</span>';}
return '<a class="model-link" href="/reputation-insight?model='+encodeURIComponent(model)+'" title="查看该车型的口碑洞察">'+safe+'</a>';}
async function load(reset){const seq=++serial;if(reset){offset=0;version='';filters={model:$('model').value.trim(),source:$('source').value,keyword:$('keyword').value.trim()};}$('query').disabled=true;$('prev').disabled=true;$('next').disabled=true;$('results').textContent='正在通过 数据服务 查询…';try{const r=await fetch('/api/reputation/reviews?'+new URLSearchParams({...filters,limit:20,offset}),{cache:'no-store'});const d=await r.json();if(seq!==serial)return;if(!r.ok||!d.success)throw Error(d.error||'口碑 数据服务 查询失败');if(version&&version!==d.data_version)throw Error('数据已更新，请重新点击查询以保证分页一致');version=d.data_version;$('results').innerHTML=d.items.length?'<table class="review-table"><thead><tr><th>#</th><th>车型</th><th>平台</th><th>发布日期</th><th>平台评分</th><th>来源</th><th>口碑洞察</th></tr></thead><tbody>'+d.items.map((x,i)=>{const safeUrl=/^https?:\/\//i.test(x.detail_url||'')?'<a href="'+esc(x.detail_url)+'" target="_blank" rel="noopener noreferrer">来源原文 ↗</a>':'<span class="muted">未提供</span>';return '<tr><td>'+String(offset+i+1)+'</td><td class="model-name">'+renderModelCell(x.model)+'</td><td><span class="badge">'+(x.source==='autohome'?'汽车之家':'懂车帝')+'</span></td><td class="muted">'+esc(x.published_date||'未提供')+'</td><td>'+esc(x.average_score==null?'未提供':x.average_score)+'</td><td>'+safeUrl+'</td><td>'+renderInsightCell(x.model)+'</td></tr><tr class="review-body"><td colspan="7"><details><summary>查看完整口碑原文</summary><div class="text">'+esc(x.review_text||'正文未提供')+'</div></details></td></tr>';}).join('')+'</tbody></table>':'<div class="empty-state">暂无符合条件的原始口碑；精确来源名称未匹配不代表所有别名都没有口碑</div>';$('results').querySelectorAll('button.insight-btn:not([disabled])').forEach(btn=>{btn.addEventListener('click',()=>openInsight(btn.getAttribute('data-insight-model')));});$('count').textContent=fmt(d.total_count)+' 条 · 第 '+(Math.floor(offset/20)+1)+' 页';$('prev').disabled=offset===0;$('next').disabled=!d.has_more;}catch(e){$('results').innerHTML='<p class="error">'+esc(e.message)+'；不使用旧结果回退。</p>';$('count').textContent='';}finally{if(seq===serial)$('query').disabled=false;}}
$('query').onclick=()=>{overview();load(true);};$('reset').onclick=()=>{$('model').value='';$('keyword').value='';$('source').value='';overview();load(true);};$('prev').onclick=()=>{offset=Math.max(0,offset-20);load(false);};$('next').onclick=()=>{offset+=20;load(false);};$('keyword').onkeydown=$('model').onkeydown=e=>{if(e.key==='Enter')$('query').click();};loadNewCarModelSet();overview();load(true);
</script></body></html>
