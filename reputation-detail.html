<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>口碑明细 · 正式库 数据服务</title>
<style>
:root{--ink:#23344e;--muted:#7b8aa1;--blue:#376aff;--line:#e2eaf7}*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:var(--ink);font:14px/1.6 "Microsoft YaHei",sans-serif}header{display:flex;justify-content:space-between;align-items:center;background:white;border-bottom:1px solid var(--line);padding:18px 28px}main{max-width:1200px;margin:30px auto;padding:0 20px}h1{font-size:26px;margin:0}a{color:var(--blue)}.muted{color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px}.stats strong{font-size:24px;display:block}.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{display:flex;flex-direction:column;gap:6px}input,select,button{font:inherit;padding:10px 13px;border:1px solid var(--line);border-radius:7px;background:white}button{cursor:pointer}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.review{padding:18px 0;border-bottom:1px solid var(--line)}.review:last-child{border:0}.review-head{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.badge{font-size:12px;background:#edf3ff;padding:3px 8px;border-radius:5px}.text{white-space:pre-wrap;overflow-wrap:anywhere;padding-top:12px}.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}.error{color:#b74724}.note{font-size:12px;color:var(--muted)}@media(max-width:600px){header{padding:14px}main{margin:18px auto;padding:0 12px}.card{padding:16px}.filters label{width:100%}.stats{gap:16px}.stats strong{font-size:21px}}
</style></head><body><header><strong>口碑明细 · 正式库 数据服务</strong><a href="/">返回主页</a></header><main>
<section class="card"><h1>汽车之家 × 懂车帝 · 原始口碑</h1><p class="muted">查询服务端正式数据库。平台评分不是统一情感分，原始口碑不等同于已完成标签分析。</p><div class="stats" id="overview">正在读取真实来源…</div><p class="note" id="analysis"></p></section>
<section class="card filters"><label>车型（精确来源名称）<input id="model" placeholder="如：理想i8 / 星光730新能源"></label><label>平台<select id="source"><option value="">全部平台</option><option value="autohome">汽车之家</option><option value="dongchedi">懂车帝</option></select></label><label>正文关键词<input id="keyword" placeholder="如：空间 / 续航"></label><button id="query" class="primary">查询</button><button id="reset">重置</button></section>
<section class="card"><div id="results" aria-live="polite">正在读取原文…</div><div class="pager"><button id="prev" disabled>上一页</button><span id="count" class="muted"></span><button id="next" disabled>下一页</button></div></section>
</main><script>
const $=id=>document.getElementById(id);const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n).toLocaleString('en-US');
let offset=0,version='',serial=0;let filters={};
$('model').value=new URLSearchParams(location.search).get('model')||'';
async function overview(){try{const r=await fetch('/api/reputation/overview',{cache:'no-store'});const d=await r.json();if(!r.ok||!d.success)throw Error();const s=d.status;$('overview').innerHTML='<div><strong>'+fmt(s.review_count)+'</strong>原始口碑</div>'+s.sources.map(x=>'<div><strong>'+fmt(x.review_count)+'</strong>'+esc(x.source==='autohome'?'汽车之家':'懂车帝')+'</div>').join('');$('analysis').textContent='最新发布日期 '+s.latest_published_date+' · '+(s.analysis_current?'本批已扫描 '+s.analysis_processed_review_count+' 条，'+s.analysis_model_count+' 个来源名称有明确标签':'原文已更新，标签需维护端增量更新')+' · 批次 '+s.analysis_batch;}catch(e){$('overview').textContent='口碑来源查询失败，不使用本地看板或静态数据回退';}}
async function load(reset){const seq=++serial;if(reset){offset=0;version='';filters={model:$('model').value.trim(),source:$('source').value,keyword:$('keyword').value.trim()};}$('query').disabled=true;$('prev').disabled=true;$('next').disabled=true;$('results').textContent='正在通过 数据服务 查询…';try{const r=await fetch('/api/reputation/reviews?'+new URLSearchParams({...filters,limit:20,offset}),{cache:'no-store'});const d=await r.json();if(seq!==serial)return;if(!r.ok||!d.success)throw Error(d.error||'口碑 数据服务 查询失败');if(version&&version!==d.data_version)throw Error('数据已更新，请重新点击查询以保证分页一致');version=d.data_version;$('results').innerHTML=d.items.length?d.items.map(x=>{const safeUrl=/^https?:\/\//i.test(x.detail_url||'')?'<a href="'+esc(x.detail_url)+'" target="_blank" rel="noopener noreferrer">来源原文 ↗</a>':'';return '<article class="review"><div class="review-head"><strong>'+esc(x.model||'来源车型名称未提供')+'</strong><span class="badge">'+(x.source==='autohome'?'汽车之家':'懂车帝')+'</span><span class="muted">'+esc(x.published_date||'发布日期未提供')+'</span><span>平台评分 '+esc(x.average_score==null?'未提供':x.average_score)+'</span>'+safeUrl+'</div><details><summary>查看完整口碑原文</summary><div class="text">'+esc(x.review_text||'正文未提供')+'</div></details></article>';}).join(''):'暂无符合条件的原始口碑；精确来源名称未匹配不代表所有别名都没有口碑';$('count').textContent=fmt(d.total_count)+' 条 · 第 '+(Math.floor(offset/20)+1)+' 页';$('prev').disabled=offset===0;$('next').disabled=!d.has_more;}catch(e){$('results').innerHTML='<p class="error">'+esc(e.message)+'；不使用旧结果回退。</p>';$('count').textContent='';}finally{if(seq===serial)$('query').disabled=false;}}
$('query').onclick=()=>{overview();load(true);};$('reset').onclick=()=>{$('model').value='';$('keyword').value='';$('source').value='';overview();load(true);};$('prev').onclick=()=>{offset=Math.max(0,offset-20);load(false);};$('next').onclick=()=>{offset+=20;load(false);};$('keyword').onkeydown=$('model').onkeydown=e=>{if(e.key==='Enter')$('query').click();};overview();load(true);
</script></body></html>
