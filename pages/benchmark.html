<section class="bm-root" aria-labelledby="bm-title">
  <header class="section-head">
    <div class="section-head__text">
      <p class="bm-eyebrow">COMPETITOR BENCHMARKING · 竞品对标</p>
      <h2 id="bm-title" class="section-head__title section-head__title--ai">竞品对标</h2>
      <p class="section-head__desc">自主识别目标车型并建立多维竞品池：款型配置信息（P0）锚定硬参数，融合口碑知识库与联网动态，交叉校验后输出对标矩阵与战略 So What。</p>
    </div>
  </header>

  <article class="bm-card">
    <form class="bm-form" id="bm-form">
      <label class="bm-label" for="bm-target">目标车型</label>
      <div class="bm-form-row">
        <input type="text" id="bm-target" class="bm-input" placeholder="例如：宋PLUS EV 或 比亚迪宋PLUS EV 2026款" autocomplete="off">
        <button type="submit" class="bm-primary" id="bm-run">开始对标</button>
      </div>
    </form>
    <p class="bm-hint">硬参数（纯电续航 / 整备质量 / 能耗 / 电池能量）以款型配置信息为唯一锚；价格阶梯分列（指导价 / 先享价 / 限时价 / 经销商价）；冲突双边呈现；缺失标 na / insufficient。</p>
    <div class="bm-status" id="bm-status" role="status" aria-live="polite">就绪。</div>
  </article>

  <article class="bm-panel" id="bm-answer-panel" hidden>
    <h3 class="bm-panel__title">对标结果</h3>
    <div class="bm-panel__body"><pre class="bm-answer" id="bm-answer"></pre></div>
  </article>

  <article class="bm-panel" id="bm-tools-panel" hidden>
    <h3 class="bm-panel__title">工具审计</h3>
    <div class="bm-panel__body"><div class="bm-tools" id="bm-tools"></div></div>
  </article>
</section>
