schema_version: 1
profile: passenger_vehicle_monthly

pages:
  - id: vehicle_category
    order: 1
    section: "2.1"
    title: 车型类别
    template_slide_index: 0
    data_block: 车型类别
    renderer_handler: update_overview_slide
    visuals:
      - monthly_volume_chart
      - share_trend_chart
      - month_and_cumulative_change_callouts
    analysis_lens:
      - 轿车SUVMPV结构分化
      - 油电替代与同期基数
      - 产品切换与新品承接
    representative_models:
      max_count: 3
      selection: 每个关键类别最多一个车型，优先绝对增减量和排名异动
    required_output:
      - 因果型页面标题
      - 总体判断
      - 代表车型
      - 已核验机制
      - 市场小结

  - id: vehicle_level
    order: 2
    section: "2.2"
    title: 车型级别
    template_slide_index: 1
    data_block: 车型级别
    renderer_handler: update_overview_slide
    visuals:
      - monthly_volume_chart
      - share_trend_chart
      - month_and_cumulative_change_callouts
    analysis_lens:
      - A00到C加级份额迁移
      - 小车承压与主流级别竞争
      - 高端供给和消费结构
    representative_models:
      max_count: 3
      selection: 增长级别和下滑级别各至少一个代表车型
    required_output:
      - 因果型页面标题
      - 级别结构判断
      - 代表车型
      - 结构迁移机制
      - 市场小结

  - id: sedan_level
    order: 3
    section: "2.3"
    title: 轿车级别
    template_slide_index: 2
    data_block: 轿车-级别
    renderer_handler: update_segment_slide
    visuals:
      - level_volume_chart
      - top15_model_chart
      - top15_model_table
    analysis_lens:
      - 轿车内部级别变化
      - 传统车压力与新能源替代
      - 价格促销和产品迭代
    representative_models:
      max_count: 3
      selection: 优先同比增减量、环比突变、新品和老产品切换
    required_output:
      - 因果型页面标题
      - 轿车总体判断
      - 代表车型变化
      - 原因与影响路径
      - 市场小结

  - id: suv_level
    order: 4
    section: "2.4"
    title: SUV级别
    template_slide_index: 3
    data_block: SUV-级别
    renderer_handler: update_segment_slide
    visuals:
      - level_volume_chart
      - top15_model_chart
      - top15_model_table
    analysis_lens:
      - SUV内部级别变化
      - 新品承接与老产品周期
      - 主力价格带竞争替代
    representative_models:
      max_count: 3
      selection: 优先同比增减量、环比突变、新品和老产品切换
    required_output:
      - 因果型页面标题
      - SUV总体判断
      - 代表车型变化
      - 原因与影响路径
      - 市场小结

  - id: mpv_level
    order: 5
    section: "2.5"
    title: MPV级别
    template_slide_index: 4
    data_block: MPV-级别
    renderer_handler: update_segment_slide
    visuals:
      - level_volume_chart
      - top15_model_chart
      - top15_model_table
    analysis_lens:
      - 商务与家用场景变化
      - 新老产品切换窗口
      - 主力车型供给和替代
    representative_models:
      max_count: 3
      selection: 优先同比增减量、换代窗口和核心车型排名异动
    required_output:
      - 因果型页面标题
      - MPV总体判断
      - 代表车型变化
      - 原因与影响路径
      - 市场小结

extension_contract:
  required_for_new_page:
    - page_spec
    - input_data_fields
    - editable_template_slide
    - parser_handler
    - renderer_handler
    - narrative_rule
    - quality_rule
    - regression_test
    - accepted_business_example
