x-mcp-common: &mcp-common
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
  restart: unless-stopped
  volumes:
    - ../../assets/data:/app/mcp/assets-data:ro
  networks: [market-mcp]

x-mcp-internal-env: &mcp-internal-env
  DATA_API_INTERNAL_URL: http://data-api:8815/api/v1
  DATA_API_INTERNAL_TOKEN: ${DATA_API_INTERNAL_TOKEN}

services:
  policy-mcp:
    <<: *mcp-common
    command: python -m market_data.policy_server
    environment:
      <<: *mcp-internal-env
      MCP_PORT: 8811
    depends_on: [data-api]
  rights-mcp:
    <<: *mcp-common
    command: python -m market_data.rights_server
    environment:
      <<: *mcp-internal-env
      MCP_PORT: 8812
    depends_on: [data-api]
  new-car-mcp:
    <<: *mcp-common
    command: python -m market_data.new_car_server
    environment:
      <<: *mcp-internal-env
      MCP_PORT: 8813
    depends_on: [data-api]
  reputation-mcp:
    <<: *mcp-common
    command: python -m market_data.reputation_server
    environment:
      <<: *mcp-internal-env
      MCP_PORT: 8814
    depends_on: [data-api]
  data-api:
    <<: *mcp-common
    command: python -m market_data.api_server
    env_file: .env
    environment:
      DATA_API_PORT: 8815
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [policy-mcp, rights-mcp, new-car-mcp, reputation-mcp, data-api]
    environment:
      MCP_API_TOKEN: ${MCP_API_TOKEN}
    ports:
      - "${MCP_GATEWAY_PORT:-8788}:80"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - mcp-exports:/srv/mcp-exports:ro
    networks: [market-mcp]

networks:
  market-mcp:

volumes:
  mcp-exports:
