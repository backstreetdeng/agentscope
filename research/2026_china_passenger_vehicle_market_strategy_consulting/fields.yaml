version: "0.1"
topic: "2026年中国乘用车市场战略咨询"

field_categories:
  - category: "source_record"
    description: "每一条外部或内部证据的可追溯记录；所有研究项均必填。"
    fields:
      - name: "source_title"
        description: "来源标题或内部数据集名称。"
        detail_level: "brief"
      - name: "source_url_or_path"
        description: "公开URL或项目内受控文件路径；无路径的口头信息不得作为事实证据。"
        detail_level: "brief"
      - name: "source_tier"
        description: "A/B/C来源等级，按权威性和可复核性分类。"
        detail_level: "brief"
      - name: "published_or_observed_at"
        description: "发布日期、数据观察期或内部数据版本日期。"
        detail_level: "moderate"
      - name: "evidence_excerpt"
        description: "支持结论的简短原文摘录或数据说明，不替代完整来源。"
        detail_level: "moderate"
      - name: "scope_and_caliber"
        description: "说明地域、车型、统计口径、样本范围和时间范围。"
        detail_level: "detailed"

  - category: "market_metrics"
    description: "用于描述市场事实的统一量化字段。"
    fields:
      - name: "metric_name"
        description: "销量、份额、同比、环比、渗透率、价格或利润等指标名称。"
        detail_level: "brief"
      - name: "metric_value_and_unit"
        description: "数值、单位及是否已完成辆/万辆标准化。"
        detail_level: "brief"
      - name: "metric_type"
        description: "明确为零售、批发、产销、出口、上险、订单或终端成交。"
        detail_level: "moderate"
      - name: "comparison_period"
        description: "本期、同比期、环比期和累计期。"
        detail_level: "moderate"
      - name: "contribution_or_rank_change"
        description: "对整体增减的贡献、份额变化、排名变化或绝对增减量。"
        detail_level: "detailed"

  - category: "market_structure"
    description: "车型类别、级别、动力形式、价格带和区域结构。"
    fields:
      - name: "segment_definition"
        description: "轿车/SUV/MPV、车型级别、动力形式、价格带或区域的定义。"
        detail_level: "brief"
      - name: "structure_change"
        description: "份额、销量、渗透率和增减方向的结构性变化。"
        detail_level: "moderate"
      - name: "representative_models"
        description: "从TOP15或其他已验证清单中选择的代表车型及其变化。"
        detail_level: "detailed"
      - name: "lifecycle_event"
        description: "上市、改款、换代、停产、产能爬坡、价格调整或产品切换事件。"
        detail_level: "detailed"

  - category: "driver_analysis"
    description: "用于把市场现象转化为有证据边界的原因判断。"
    fields:
      - name: "overall_judgement"
        description: "先给出该市场或页面的一句总体判断，不直接堆砌数据。"
        detail_level: "moderate"
      - name: "observed_fact"
        description: "支撑判断的销量、份额、TOP15车型或政策事实。"
        detail_level: "detailed"
      - name: "driver_type"
        description: "政策、宏观、产品、价格、补能、渠道、区域、季节性或基数效应。"
        detail_level: "brief"
      - name: "causal_mechanism"
        description: "说明该驱动如何影响目标市场，不把相关性表述为确定因果。"
        detail_level: "detailed"
      - name: "confidence_level"
        description: "高/中/低；由证据强度、来源一致性和口径匹配度决定。"
        detail_level: "brief"
      - name: "alternative_explanations"
        description: "可能的其他解释、反证或未能排除的影响因素。"
        detail_level: "detailed"

  - category: "competition_and_product"
    description: "品牌、竞品与产品方案的战略评价。"
    fields:
      - name: "competitive_set"
        description: "目标细分市场的核心品牌、车型及可比边界。"
        detail_level: "moderate"
      - name: "competitive_advantage_or_barrier"
        description: "价格、产品、补能、渠道、品牌、供应链或软件能力形成的优势/壁垒。"
        detail_level: "detailed"
      - name: "configuration_threshold"
        description: "用户可感知的准入配置、可选装配置和差异化配置。"
        detail_level: "detailed"
      - name: "pricing_and_profit_signal"
        description: "指导价、成交价、金融权益、残值和盈利压力的口径化判断。"
        detail_level: "detailed"

  - category: "consumer_and_channel"
    description: "连接市场战略与用户洞察智能体的字段。"
    fields:
      - name: "target_user_segment"
        description: "人群、预算、城市级别、家庭阶段和购车类型。"
        detail_level: "moderate"
      - name: "purchase_motivation_and_pain_points"
        description: "购车动机、补能/续航/空间/安全/智驾等痛点及强度。"
        detail_level: "detailed"
      - name: "purchase_barrier"
        description: "价格、补能、信任、保值、渠道或牌照等阻碍转化的因素。"
        detail_level: "detailed"
      - name: "channel_signal"
        description: "询盘、试驾、订单、交付、金融和置换的可观察信号及来源。"
        detail_level: "moderate"

  - category: "strategic_decision"
    description: "把研究结果沉淀为管理动作。"
    fields:
      - name: "opportunity_or_risk_grade"
        description: "A级机会、B级机会、C级观察或D级预警，并说明评分依据。"
        detail_level: "moderate"
      - name: "recommended_action"
        description: "进入、加码、观察、暂缓、降资源或退出等建议。"
        detail_level: "moderate"
      - name: "regional_capacity_or_channel_action"
        description: "投放区域、产能、物流、渠道和配置包的具体建议。"
        detail_level: "detailed"
      - name: "decision_condition_and_trigger"
        description: "建议成立的前提、解除暂缓或触发预警的量化/定性条件。"
        detail_level: "detailed"
      - name: "next_verification"
        description: "下一次应补充的内部数据、访谈、调研或外部证据。"
        detail_level: "moderate"

  - category: "data_quality"
    description: "避免把口径不一致、低质量或过期信息写入正式结论。"
    fields:
      - name: "data_quality_status"
        description: "通过、待核验、冲突、过期或不可用。"
        detail_level: "brief"
      - name: "data_gap_or_conflict"
        description: "缺失字段、来源冲突、单位/口径不一致及处理方式。"
        detail_level: "detailed"
      - name: "claim_boundary"
        description: "明确事实、推断、预测和假设之间的边界。"
        detail_level: "detailed"

uncertain:
  description: "深度调研阶段自动填写：尚无可靠来源、来源冲突、无法量化或需要业务确认的字段。"
  detail_level: "detailed"
